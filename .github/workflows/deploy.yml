name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-sopt-assignment
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: arn:aws:iam::092205142257:role/sopt-assignment-github-actions
  API_REPO: sopt-assignment-api

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      api_image: ${{ steps.image.outputs.api }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Resolve image tag
        id: image
        run: echo "api=${{ steps.ecr.outputs.registry }}/${API_REPO}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build & push API
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.api }}
            ${{ steps.ecr.outputs.registry }}/${{ env.API_REPO }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Issue short-lived ECR token
        id: token
        run: |
          password=$(aws ecr get-login-password --region "$AWS_REGION")
          echo "::add-mask::$password"
          account=$(aws sts get-caller-identity --query Account --output text)
          {
            echo "password<<TOKEN_EOF"
            echo "$password"
            echo "TOKEN_EOF"
            echo "registry=${account}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          } >> "$GITHUB_OUTPUT"

      - name: Render .env
        env:
          API_IMAGE: ${{ needs.build.outputs.api_image }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          umask 077
          put() {
            case "$2" in
              *"'"*|*$'\n'*|*\\) echo "::error::$1 에 작은따옴표/줄바꿈이 있거나 \\ 로 끝나 .env 에 쓸 수 없다"; exit 1 ;;
            esac
            printf "%s='%s'\n" "$1" "$2"
          }
          {
            put API_IMAGE           "$API_IMAGE"
            put API_DOMAIN          "$API_DOMAIN"
            put SPRING_DATASOURCE_PASSWORD "$DB_PASSWORD"
          } > deploy/.env
          chmod 644 deploy/.env

      - name: Copy stack files to EC2
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/.env"
          target: "~/sopt-assignment"
          strip_components: 1
          overwrite: true

      - name: Pull & restart
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: ECR_REGISTRY,ECR_PASSWORD
          script: |
            set -euo pipefail
            cd ~/sopt-assignment
            chmod 600 .env
            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker logout "$ECR_REGISTRY"
            docker image prune -af --filter "until=168h"
        env:
          ECR_REGISTRY: ${{ steps.token.outputs.registry }}
          ECR_PASSWORD: ${{ steps.token.outputs.password }}
