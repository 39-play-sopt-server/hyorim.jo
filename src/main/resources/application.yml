spring:
  application:
    name: assignment

  profiles:
    default: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000 # 30분 (ms)
  refresh-token-expiration: 1209600000 # 14일 (ms)

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
